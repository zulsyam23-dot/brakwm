[workspace]
resolver = "2"
members = [
    "brakwm-core",
    "brakwm-frontend",
    "brakwm-ir-ast",
    "brakwm-ir-hir",
    "brakwm-ir-mir",
    "brakwm-ir-lir",
    "brakwm-codegen-traits",
    "brakwm-codegen-wat",
    "brakwm-codegen-wasm",
    "brakwm-link-traits",
    "brakwm-link-wasm",
    "brakwm-tool",
    "brakwm-link-archive",
    "brakwm-bitcode",
    "brakwm-opt-traits",
    "brakwm-opt-dce",
    "brakwm-opt-cp",
    "brakwm-opt-gvn",
    "brakwm-opt-inline",
    "brakwm-test",
    "brakwm-lang-lit",
    "brakwm-opt-utils",
    "brakwm-opt-licm",
    "brakwm-opt-jt",
    "brakwm-opt-tco",
    "brakwm-opt-fold",
    "brakwm-easy",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/zulsyam23-dot/brakwm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
libloading = "0.8"